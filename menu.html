<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Menü</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#f3f3f3;
}

/* HEADER */
.header{
  height:230px;
  background:url("https://images.unsplash.com/photo-1555396273-367ea4eb4db5") center/cover;
  position:relative;
}
.overlay{
  backdrop-filter: blur(6px);
  background: rgba(0,0,0,0.4);
  height:100%;
  padding:20px;
  color:white;
}
.logo{font-size:26px;font-weight:bold;}
.masa{margin-top:5px;opacity:0.8;}
.search{
  margin-top:15px;
  width:100%;
  padding:12px;
  border-radius:25px;
  border:none;
}

/* KATEGORİ */
.kategoriBar{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}
.kategoriBtn{
  padding:10px 15px;
  border-radius:20px;
  background:white;
}
.kategoriBtn.active{
  background:#ff9800;
  color:white;
}

/* ÜRÜNLER */
.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}
.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}
.cardContent{padding:10px;}
.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.price{color:#ff9800;font-weight:bold;}
.addBtn{
  background:#ff9800;
  border:none;
  color:white;
  border-radius:50%;
  width:32px;
  height:32px;
}

/* SEPET ALT BAR */
.cartBar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:10px;
}
.send{
  background:linear-gradient(45deg,#007bff,#4da3ff);
  color:white;
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
}

/* SEPET PANEL */
.cartPanel{
  position:fixed;
  right:-100%;
  top:0;
  width:80%;
  height:100%;
  background:white;
  padding:20px;
  transition:0.3s;
  z-index:999;
}
.cartPanel.active{
  right:0;
}
.cartHeader{
  display:flex;
  justify-content:space-between;
  font-size:20px;
}
</style>
</head>

<body>

<div class="header">
  <div class="overlay">
    <div class="logo">🌸 RüzgarGülü</div>
    <div class="masa" id="masa"></div>
    <input id="search" class="search" placeholder="🔍 Ürün ara...">
  </div>

  <button onclick="acSepet()" style="margin:10px">
    🛒 Sepet
  </button>
</div>

<div class="kategoriBar" id="kategoriBar"></div>
<div id="menu"></div>

<!-- ✅ TEK SEPET PANEL -->
<div id="cartPanel" class="cartPanel">
  <div class="cartHeader">
    🛒 Sepet
    <span onclick="kapatSepet()">✖</span>
  </div>

  <div id="cartItems"></div>
  <h3 id="cartTotal">Toplam: 0₺</h3>

  <button class="send" onclick="siparis()">Siparişi Gönder</button>
</div>

<div class="cartBar">
  <h3 id="total">Toplam: 0₺</h3>
  <button class="send" onclick="siparis()">Siparişi Gönder</button>
</div>

<script type="module">

import { db } from "./app.js";
import {
  collection,
  getDocs,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const masa = new URLSearchParams(location.search).get("table");
document.getElementById("masa").innerText = "Masa: " + masa;

let sepet = [];
let kategoriler = [];
let aktifKategori = null;

// 🔥 MENÜ
async function loadMenu(){

  const urunSnap = await getDocs(collection(db,"products"));
  const katSnap = await getDocs(collection(db,"categories"));

  kategoriler = [];

  katSnap.forEach(d=>{
    kategoriler.push({
      id:d.id,
      name:d.data().name,
      items:[]
    });
  });

  urunSnap.forEach(d=>{
    const p = d.data();

    const kat = kategoriler.find(x=>x.id===p.categoryId);
    if(kat){
      kat.items.push({
        id:d.id,
        ...p,
        price:Number(p.price)
      });
    }
  });

  kategoriUI();
  render();
}

// 🔥 KATEGORİ
function kategoriUI(){
  let html = `<div class="kategoriBtn active" onclick="filtre(null)">Tümü</div>`;

  kategoriler.forEach(k=>{
    html += `<div class="kategoriBtn" onclick="filtre('${k.id}')">${k.name}</div>`;
  });

  document.getElementById("kategoriBar").innerHTML = html;
}

// 🔥 FİLTRE
window.filtre = (id)=>{
  aktifKategori = id;
  render();
};

// 🔥 RENDER
function render(){

  let arama = document.getElementById("search").value.toLowerCase();
  let html = "";

  kategoriler.forEach(k=>{

    let items = k.items.filter(p=>{
      return (!aktifKategori || p.categoryId === aktifKategori)
      && p.name.toLowerCase().includes(arama);
    });

    if(items.length===0) return;

    html += `<div class="products">`;

    items.forEach(p=>{
      html += `
      <div class="card">
        <img src="${p.image || 'https://via.placeholder.com/300'}">
        <div class="cardContent">
          <h3>${p.name}</h3>
          <div class="bottom">
            <span class="price">${p.price}₺</span>
            <button class="addBtn" onclick="ekle('${p.id}','${p.name}',${p.price})">+</button>
          </div>
        </div>
      </div>`;
    });

    html += `</div>`;
  });

  document.getElementById("menu").innerHTML = html;
}

document.getElementById("search").addEventListener("input", render);

// 🛒 SEPET
window.ekle = (id,name,price)=>{
  const item = sepet.find(x=>x.id===id);
  if(item) item.qty++;
  else sepet.push({id,name,price,qty:1});
  guncelle();
};

function guncelle(){
  let html="";
  let total=0;

  sepet.forEach(i=>{
    html += `${i.name} x ${i.qty}<br>`;
    total += i.price * i.qty;
  });

  document.getElementById("total").innerText = "Toplam: " + total + "₺";
  document.getElementById("cartItems").innerHTML = html;
  document.getElementById("cartTotal").innerText = "Toplam: " + total + "₺";
}

// 📦 SİPARİŞ
window.siparis = async ()=>{
  if(sepet.length===0) return alert("Sepet boş");

  let total=0;
  sepet.forEach(i=> total += i.price*i.qty);

  await addDoc(collection(db,"orders"),{
    table: masa,
    items: sepet,
    total,
    status:"Bekliyor",
    createdAt: serverTimestamp()
  });

  alert("Sipariş gönderildi");
  sepet=[];
  guncelle();
};

// 🎯 PANEL
window.acSepet = ()=>{
  document.getElementById("cartPanel").classList.add("active");
};
window.kapatSepet = ()=>{
  document.getElementById("cartPanel").classList.remove("active");
};

loadMenu();

</script>

</body>
</html>
