<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Menü</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#f3f3f3;
  padding-bottom:120px;
}

.header{
  height:220px;
  background:url("https://images.unsplash.com/photo-1555396273-367ea4eb4db5") center/cover no-repeat;
  position:relative;
}

.overlay{
  background: rgba(0,0,0,0.45);
  height:100%;
  padding:20px;
  color:white;
}

.logo{
  font-family:'Pacifico',cursive;
  font-size:30px;
}

.masa{
  opacity:0.8;
}

.search{
  margin-top:15px;
  width:100%;
  padding:12px;
  border-radius:25px;
  border:none;
}

.cartTop{
  position:absolute;
  top:15px;
  right:15px;
  background:#ff9800;
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:12px;
}

.kategoriBar{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:15px;
}

.kategoriBtn{
  padding:10px 15px;
  border-radius:20px;
  background:white;
}

.kategoriBtn.active{
  background:#ff9800;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:10px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:130px;
  object-fit:cover;
}

.cardContent{
  padding:10px;
}

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.price{
  color:#ff9800;
  font-weight:bold;
}

/* + - */
.qtyBox{
  display:flex;
  align-items:center;
  gap:6px;
}

.qtyBtn{
  width:28px;
  height:28px;
  border:none;
  background:#ff9800;
  color:white;
  border-radius:6px;
}

.cartBar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:15px;
  box-shadow:0 -4px 20px rgba(0,0,0,0.15);
}

.mainOrderBtn{
  background:linear-gradient(45deg,#007bff,#004aad);
  color:white;
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  font-weight:bold;
}

/* SEPET PANEL */
.cartPanel{
  position:fixed;
  right:-100%;
  top:0;
  width:85%;
  height:100%;
  background:white;
  padding:20px;
  transition:0.3s;
  z-index:999;
}

.cartPanel.active{
  right:0;
}

.cartHeader{
  display:flex;
  justify-content:space-between;
  font-size:20px;
}

/* ekstra */
.extraBtn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.callBtn{background:#ff9800;color:white;}
.billBtn{background:#333;color:white;}

</style>
</head>

<body>

<div class="header">
  <button class="cartTop" onclick="acSepet()">🛒</button>

  <div class="overlay">
    <div class="logo">RüzgarGülü Cafe</div>
    <div id="masa"></div>
    <input id="search" class="search" placeholder="🔍 Ürün ara...">
  </div>
</div>

<div class="kategoriBar" id="kategoriBar"></div>
<div id="menu"></div>

<!-- SEPET PANEL -->
<div id="cartPanel" class="cartPanel">

  <div class="cartHeader">
    🧾 Hesabım
    <span onclick="kapatSepet()">✖</span>
  </div>

  <div id="cartItems">Henüz sipariş yok</div>
  <h3 id="cartTotal">Toplam: 0₺</h3>

  <button class="extraBtn callBtn" onclick="garson()">🛎 Garson Çağır</button>
  <button class="extraBtn billBtn" onclick="hesap()">💳 Hesap İste</button>

</div>

<div class="cartBar">
  <h3 id="total">Toplam: 0₺</h3>
  <button class="mainOrderBtn" onclick="siparis()">🚀 Siparişi Gönder</button>
</div>

<script type="module">

import { db } from "./app.js";
import {
  collection,
  getDocs,
  addDoc,
  serverTimestamp,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const masa = new URLSearchParams(location.search).get("table");
document.getElementById("masa").innerText = "Masa: " + masa;

let kategoriler = [];
let aktifKategori = null;
let secim = {}; // sadece geçici seçim

// MENÜ
async function loadMenu(){

  const urunSnap = await getDocs(collection(db,"products"));
  const katSnap = await getDocs(collection(db,"categories"));

  kategoriler = [];

  katSnap.forEach(d=>{
    kategoriler.push({
      id:d.id,
      name:d.data().name,
      items:[]
    });
  });

  urunSnap.forEach(d=>{
    const p = d.data();
    const kat = kategoriler.find(x=>x.id===p.categoryId);

    if(kat){
      kat.items.push({
        id:d.id,
        ...p,
        price:Number(p.price)
      });
    }
  });

  kategoriUI();
  render();
}

// kategori
function kategoriUI(){
  let html = `<div class="kategoriBtn active" onclick="filtre(null)">Tümü</div>`;
  kategoriler.forEach(k=>{
    html += `<div class="kategoriBtn" onclick="filtre('${k.id}')">${k.name}</div>`;
  });
  document.getElementById("kategoriBar").innerHTML = html;
}

window.filtre = (id)=>{
  aktifKategori = id;
  render();
};

// ürünler
function render(){

  let arama = document.getElementById("search").value.toLowerCase();
  let html = "";

  kategoriler.forEach(k=>{

    let items = k.items.filter(p=>{
      return (!aktifKategori || p.categoryId === aktifKategori)
      && p.name.toLowerCase().includes(arama);
    });

    if(items.length===0) return;

    html += `<div class="products">`;

    items.forEach(p=>{
      html += `
      <div class="card">
        <img src="${p.image || 'https://via.placeholder.com/300'}">
        <div class="cardContent">
          <h3>${p.name}</h3>

          <div class="bottom">
            <span class="price">${p.price}₺</span>

            <div class="qtyBox">
              <button class="qtyBtn" onclick="azalt('${p.id}')">-</button>
              <span id="qty_${p.id}">${secim[p.id] || 0}</span>
              <button class="qtyBtn" onclick="arttir('${p.id}')">+</button>
            </div>

          </div>
        </div>
      </div>`;
    });

    html += `</div>`;
  });

  document.getElementById("menu").innerHTML = html;
}

document.getElementById("search").addEventListener("input", render);

// + -
window.arttir = (id)=>{
  secim[id] = (secim[id] || 0) + 1;
  document.getElementById("qty_"+id).innerText = secim[id];
};

window.azalt = (id)=>{
  if(!secim[id]) return;
  secim[id]--;
  document.getElementById("qty_"+id).innerText = secim[id] || 0;
};

// sipariş
window.siparis = async ()=>{

  let items = [];
  let total = 0;

  for(let id in secim){

    const urun = kategoriler.flatMap(k=>k.items).find(p=>p.id===id);

    if(!urun) continue;

    items.push({
      id:urun.id,
      name:urun.name,
      price:urun.price,
      qty:secim[id]
    });

    total += urun.price * secim[id];
  }

  if(items.length===0){
    return alert("Ürün seçmediniz");
  }

  await addDoc(collection(db,"orders"),{
    table: masa,
    items,
    total,
    closed:false,
    createdAt: serverTimestamp()
  });

  alert("Sipariş gönderildi");

  secim = {};
  render();
};

// 🔥 CANLI HESAP
function hesapDinle(){

  onSnapshot(collection(db,"orders"), (snap)=>{

    let html = "";
    let total = 0;

    snap.forEach(d=>{
      const o = d.data();

      if(o.table !== masa) return;
      if(o.closed === true) return;

      (o.items || []).forEach(i=>{
        html += `${i.name} x${i.qty}<br>`;
        total += i.price * i.qty;
      });
    });

    document.getElementById("cartItems").innerHTML =
      html || "Henüz sipariş yok";

    document.getElementById("cartTotal").innerText =
      "Toplam: " + total + "₺";

    document.getElementById("total").innerText =
      "Toplam: " + total + "₺";
  });

}

// garson
window.garson = async ()=>{
  await addDoc(collection(db,"calls"),{
    table: masa,
    createdAt: serverTimestamp()
  });
  alert("Garson geliyor");
};

// hesap
window.hesap = async ()=>{
  await addDoc(collection(db,"billRequests"),{
    table: masa,
    createdAt: serverTimestamp()
  });
  alert("Hesap istendi");
};

// panel
window.acSepet = ()=> document.getElementById("cartPanel").classList.add("active");
window.kapatSepet = ()=> document.getElementById("cartPanel").classList.remove("active");

loadMenu();
hesapDinle();

</script>

</body>
</html>
