<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Menü</title>

<style>

/* 🌙 ARKA PLAN */
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* 🔝 ÜST BAR */
.top{
  background:#111;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

/* 🔘 BUTONLAR */
.actions{
  display:flex;
  gap:10px;
  padding:10px;
}

.actions button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
}

.call{ background:#f59e0b; }
.bill{ background:#374151; }

/* 📦 KATEGORİ */
.category{
  margin:15px;
}

.category h2{
  margin-bottom:10px;
  border-left:4px solid #22c55e;
  padding-left:10px;
}

/* 🍔 ÜRÜN KART */
.productCard{
  display:flex;
  gap:10px;
  background:rgba(255,255,255,0.07);
  padding:10px;
  border-radius:12px;
  margin-bottom:10px;
  align-items:center;
  backdrop-filter:blur(10px);
}

/* 📸 FOTO */
.productCard img{
  width:80px;
  height:80px;
  border-radius:10px;
  object-fit:cover;
}

/* 📝 BİLGİ */
.info{
  flex:1;
}

.info h3{
  margin:0;
  font-size:16px;
}

.price{
  color:#22c55e;
  font-weight:bold;
}

/* ➕ BUTON */
.productCard button{
  background:#22c55e;
  border:none;
  color:white;
  padding:8px 12px;
  border-radius:8px;
}

/* 🧾 HESAP */
.hesap{
  background:rgba(255,255,255,0.08);
  margin:10px;
  padding:10px;
  border-radius:12px;
}

/* 🛒 ALT BAR */
.cart{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  padding:10px;
}

/* 🚀 SİPARİŞ */
.send{
  background:#3b82f6;
  color:white;
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
}

</style>
</head>

<body>

<div class="top">
  <h3 id="masa"></h3>
</div>

<div class="actions">
  <button class="call" onclick="garson()">🛎 Garson</button>
  <button class="bill" onclick="hesap()">💳 Hesap İste</button>
</div>

<div class="hesap">
  <h3>🧾 Hesabım</h3>
  <div id="hesapList">Henüz sipariş yok</div>
  <h3 id="hesapTotal">Toplam: 0₺</h3>
</div>

<div id="menu"></div>

<div class="cart">
  <div id="cartList"></div>
  <h3 id="total">Toplam: 0₺</h3>
  <button class="send" onclick="siparis()">Siparişi Gönder</button>
</div>

<script type="module">

import { db } from "./app.js";
import {
  collection,
  getDocs,
  addDoc,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const masa = new URLSearchParams(location.search).get("table");

if(!masa){
  document.body.innerHTML = "<h2 style='text-align:center;margin-top:50px'>QR ile giriş yapın</h2>";
  throw new Error("Masa yok");
}

document.getElementById("masa").innerText = "Masa: " + masa;

let sepet = [];

/* 🔥 MENÜ */
async function loadMenu(){

const urunSnap = await getDocs(collection(db,"products"));
const katSnap = await getDocs(collection(db,"categories"));

let kategoriler = {};

katSnap.forEach(d=>{
  kategoriler[d.id] = {
    name: d.data().name,
    items: []
  };
});

urunSnap.forEach(d=>{
  const p = d.data();

  if(p.categoryId && kategoriler[p.categoryId]){
    kategoriler[p.categoryId].items.push({
      id: d.id,
      ...p,
      price: Number(p.price)
    });
  }
});

let html = "";

Object.values(kategoriler).forEach(k=>{

  if(k.items.length === 0) return;

  html += `<div class="category"><h2>${k.name}</h2>`;

  k.items.forEach(p=>{

    html += `
    <div class="productCard">

      <img src="${p.image || 'https://via.placeholder.com/80'}">

      <div class="info">
        <h3>${p.name}</h3>
        <div class="price">${p.price}₺</div>
      </div>

      <button onclick="ekle('${p.id}','${p.name}',${p.price})">
        ➕
      </button>

    </div>
    `;
  });

  html += `</div>`;
});

document.getElementById("menu").innerHTML = html;
}

/* ➕ SEPET */
window.ekle = (id,name,price)=>{
  const item = sepet.find(x=>x.id===id);
  if(item) item.qty++;
  else sepet.push({id,name,price,qty:1});
  guncelle();
};

/* 🔄 SEPET */
function guncelle(){
  let html="";
  let total=0;

  sepet.forEach(i=>{
    html += `${i.name} x${i.qty}<br>`;
    total += i.price * i.qty;
  });

  document.getElementById("cartList").innerHTML = html;
  document.getElementById("total").innerText = "Toplam: " + total + "₺";
}

/* 📦 SİPARİŞ */
window.siparis = async ()=>{
  if(sepet.length===0){
    alert("Sepet boş");
    return;
  }

  let total=0;
  sepet.forEach(i=> total += i.price*i.qty);

  await addDoc(collection(db,"orders"),{
    table: masa,
    items: sepet,
    total: total,
    status: "Bekliyor",
    closed: false,
    createdAt: serverTimestamp()
  });

  alert("Sipariş gönderildi");
  sepet=[];
  guncelle();
};

/* 🛎 GARSON */
window.garson = async ()=>{
  await addDoc(collection(db,"calls"),{
    table: masa,
    createdAt: serverTimestamp()
  });
  alert("Garson geliyor");
};

/* 💳 HESAP */
window.hesap = async ()=>{
  const snap = await getDocs(collection(db,"orders"));

  let total = 0;
  let items = [];

  snap.forEach(d=>{
    const o = d.data();

    if(o.table === masa && !o.closed){
      total += o.total || 0;
      (o.items || []).forEach(i=>{
        items.push(i.name + " x" + i.qty);
      });
    }
  });

  await addDoc(collection(db,"billRequests"),{
    table: masa,
    total,
    items,
    createdAt: serverTimestamp()
  });

  alert("Hesap istendi");
};

/* 🔥 CANLI HESAP */
function hesapYukle(){
  onSnapshot(collection(db,"orders"), (snap)=>{

    let html = "";
    let total = 0;

    snap.forEach(d=>{
      const o = d.data();

      if(o.table !== masa) return;
      if(o.closed === true) return;

      (o.items || []).forEach(i=>{
        html += `${i.name} x${i.qty}<br>`;
        total += i.price * i.qty;
      });
    });

    document.getElementById("hesapList").innerHTML =
      html || "Henüz sipariş yok";

    document.getElementById("hesapTotal").innerText =
      "Toplam: " + total + "₺";

  });
}

loadMenu();
hesapYukle();

</script>

</body>
</html>
