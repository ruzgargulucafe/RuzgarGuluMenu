<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Menü</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#f3f3f3;
  padding-bottom:120px;
}

/* HEADER */
.header{
  height:220px;
  background:url("https://images.unsplash.com/photo-1555396273-367ea4eb4db5") center/cover no-repeat;
  position:relative;
}

.overlay{
  background: rgba(0,0,0,0.45);
  height:100%;
  padding:20px;
  color:white;
}

.logo{
  font-family:'Pacifico',cursive;
  font-size:30px;
}

.masa{ opacity:0.8; margin-top:5px; }

.search{
  margin-top:15px;
  width:100%;
  padding:12px;
  border-radius:25px;
  border:none;
}

/* SEPET BUTON */
.cartTop{
  position:absolute;
  top:15px;
  right:15px;
  background:#ff9800;
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}

/* KATEGORİ */
.kategoriBar{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:15px;
}

.kategoriBtn{
  padding:10px 15px;
  border-radius:20px;
  background:white;
}

/* ÜRÜNLER */
.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:10px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:130px;
  object-fit:cover;
}

.cardContent{ padding:10px; }

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.price{ color:#ff9800; font-weight:bold; }

/* ➕➖ BUTON */
.qtyBox{
  display:flex;
  align-items:center;
  gap:6px;
}

.qtyBtn{
  background:#ff9800;
  border:none;
  color:white;
  border-radius:50%;
  width:28px;
  height:28px;
  font-size:16px;
}

.qtyText{
  font-weight:bold;
}

/* ALT BAR */
.cartBar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:12px;
  box-shadow:0 -4px 20px rgba(0,0,0,0.15);
}

.mainOrderBtn{
  background:linear-gradient(45deg,#ff6a00,#ff9800);
  color:white;
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
}

/* SEPET PANEL */
.cartPanel{
  position:fixed;
  right:-100%;
  top:0;
  width:85%;
  height:100%;
  background:white;
  padding:20px;
  transition:0.3s;
}

.cartPanel.active{
  right:0;
}

.cartHeader{
  display:flex;
  justify-content:space-between;
  font-size:20px;
  margin-bottom:10px;
}

.cartItem{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

</style>
</head>

<body>

<div class="header">
  <button class="cartTop" onclick="acSepet()">🛒</button>

  <div class="overlay">
    <div class="logo">RüzgarGülü Cafe</div>
    <div class="masa" id="masa"></div>
    <input id="search" class="search" placeholder="🔍 Ürün ara...">
  </div>
</div>

<div class="kategoriBar" id="kategoriBar"></div>
<div id="menu"></div>

<!-- SEPET -->
<div id="cartPanel" class="cartPanel">
  <div class="cartHeader">
    🛒 Sepet
    <span onclick="kapatSepet()">✖</span>
  </div>

  <div id="cartItems"></div>
  <h3 id="cartTotal">Toplam: 0₺</h3>
</div>

<!-- ALT -->
<div class="cartBar">
  <h3 id="total">Toplam: 0₺</h3>
  <button class="mainOrderBtn" onclick="siparis()">🚀 Siparişi Gönder</button>
</div>

<script type="module">

import { db } from "./app.js";
import {
  collection,
  getDocs,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const masa = new URLSearchParams(location.search).get("table");
document.getElementById("masa").innerText = "Masa: " + masa;

let kategoriler = [];
let sepet = [];

// MENÜ
async function loadMenu(){

  const urunSnap = await getDocs(collection(db,"products"));
  const katSnap = await getDocs(collection(db,"categories"));

  kategoriler = [];

  katSnap.forEach(d=>{
    kategoriler.push({
      id:d.id,
      name:d.data().name,
      items:[]
    });
  });

  urunSnap.forEach(d=>{
    const p = d.data();
    const kat = kategoriler.find(x=>x.id===p.categoryId);

    if(kat){
      kat.items.push({
        id:d.id,
        ...p,
        price:Number(p.price)
      });
    }
  });

  render();
}

// RENDER
function render(){

  let html = "";

  kategoriler.forEach(k=>{

    html += `<div class="products">`;

    k.items.forEach(p=>{

      const item = sepet.find(x=>x.id===p.id);
      const qty = item ? item.qty : 0;

      html += `
      <div class="card">
        <img src="${p.image || 'https://via.placeholder.com/300'}">
        <div class="cardContent">
          <h3>${p.name}</h3>

          <div class="bottom">
            <span class="price">${p.price}₺</span>

            <div class="qtyBox">
              <button class="qtyBtn" onclick="azalt('${p.id}')">-</button>
              <span class="qtyText">${qty}</span>
              <button class="qtyBtn" onclick="arttir('${p.id}','${p.name}',${p.price})">+</button>
            </div>

          </div>
        </div>
      </div>`;
    });

    html += `</div>`;
  });

  document.getElementById("menu").innerHTML = html;
}

// ➕
window.arttir = (id,name,price)=>{
  const item = sepet.find(x=>x.id===id);

  if(item){
    item.qty++;
  }else{
    sepet.push({id,name,price,qty:1});
  }

  guncelle();
  render();
};

// ➖
window.azalt = (id)=>{
  const item = sepet.find(x=>x.id===id);
  if(!item) return;

  item.qty--;

  if(item.qty <= 0){
    sepet = sepet.filter(x=>x.id !== id);
  }

  guncelle();
  render();
};

// 🔄 SEPET
function guncelle(){

  let html="";
  let total=0;

  sepet.forEach(i=>{
    html += `
    <div class="cartItem">
      ${i.name} x${i.qty}
      <b>${i.price * i.qty}₺</b>
    </div>
    `;
    total += i.price * i.qty;
  });

  document.getElementById("cartItems").innerHTML =
    html || "Sepet boş";

  document.getElementById("cartTotal").innerText =
    "Toplam: " + total + "₺";

  document.getElementById("total").innerText =
    "Toplam: " + total + "₺";
}

// 🚀 SİPARİŞ
window.siparis = async ()=>{

  if(sepet.length===0){
    alert("Sepet boş");
    return;
  }

  let total=0;
  sepet.forEach(i=> total += i.price*i.qty);

  await addDoc(collection(db,"orders"),{
    table: masa,
    items: sepet,
    total,
    status:"Bekliyor",
    createdAt: serverTimestamp()
  });

  alert("Sipariş gönderildi");

  sepet=[];
  guncelle();
  render();
};

// PANEL
window.acSepet = ()=>{
  document.getElementById("cartPanel").classList.add("active");
};

window.kapatSepet = ()=>{
  document.getElementById("cartPanel").classList.remove("active");
};

loadMenu();

</script>

</body>
</html>
