<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Menü</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#f3f3f3;
  padding-bottom:120px;
}

.header{
  height:220px;
  background:url("https://images.unsplash.com/photo-1555396273-367ea4eb4db5") center/cover no-repeat;
  position:relative;
}

.overlay{
  background: rgba(0,0,0,0.45);
  height:100%;
  padding:20px;
  color:white;
}

.logo{
  font-family:'Pacifico',cursive;
  font-size:30px;
}

.masa{
  opacity:0.8;
  margin-top:5px;
}

.search{
  margin-top:15px;
  width:100%;
  padding:12px;
  border-radius:25px;
  border:none;
}

.cartTop{
  position:absolute;
  top:15px;
  right:15px;
  background:#ff9800;
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:12px;
}

.kategoriBar{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:15px;
}

.kategoriBtn{
  padding:10px 15px;
  border-radius:20px;
  background:white;
}

.kategoriBtn.active{
  background:#ff9800;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:10px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:130px;
  object-fit:cover;
}

.cardContent{
  padding:10px;
}

.bottom{
  display:flex;
  justify-content:space-between;
}

.price{
  color:#ff9800;
  font-weight:bold;
}

.addBtn{
  background:#ff9800;
  border:none;
  color:white;
  border-radius:50%;
  width:34px;
  height:34px;
}

.cartBar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:15px;
}

.mainOrderBtn{
  background:linear-gradient(45deg,#ff7a00,#ff9800);
  color:white;
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  font-weight:bold;
}

.cartPanel{
  position:fixed;
  right:-100%;
  top:0;
  width:85%;
  height:100%;
  background:white;
  padding:20px;
  transition:0.3s;
  z-index:999;
}

.cartPanel.active{
  right:0;
}

.extraBtn{
  width:100%;
  margin-top:10px;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:bold;
}

.callBtn{ background:#ff9800; color:white; }
.billBtn{ background:#333; color:white; }
</style>
</head>

<body>

<div class="header">
  <button class="cartTop" onclick="acSepet()">🛒</button>

  <div class="overlay">
    <div class="logo">RüzgarGülü Cafe</div>
    <div id="masa"></div>
    <input id="search" class="search" placeholder="🔍 Ürün ara...">
  </div>
</div>

<div class="kategoriBar" id="kategoriBar"></div>
<div id="menu"></div>

<!-- SEPET -->
<div id="cartPanel" class="cartPanel">

  <div style="display:flex; justify-content:space-between;">
    <b>🛒 Sepet</b>
    <span onclick="kapatSepet()">✖</span>
  </div>

  <div id="cartItems"></div>

  <h3 id="cartTotal">Toplam: 0₺</h3>

  <button class="extraBtn callBtn" onclick="garson()">🛎 Garson Çağır</button>
  <button class="extraBtn billBtn" onclick="hesap()">💳 Hesap İste</button>

</div>

<div class="cartBar">
  <h3 id="total">Toplam: 0₺</h3>
  <button class="mainOrderBtn" onclick="siparis()">🚀 Siparişi Gönder</button>
</div>

<script type="module">

import { db } from "./app.js";
import {
  collection,
  getDocs,
  addDoc,
  serverTimestamp,
  onSnapshot,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const masa = new URLSearchParams(location.search).get("table");
document.getElementById("masa").innerText = "Masa: " + masa;

let sepet = [];
let kategoriler = [];

// MENÜ
async function loadMenu(){
  const urunSnap = await getDocs(collection(db,"products"));
  const katSnap = await getDocs(collection(db,"categories"));

  kategoriler = [];

  katSnap.forEach(d=>{
    kategoriler.push({ id:d.id, name:d.data().name, items:[] });
  });

  urunSnap.forEach(d=>{
    const p = d.data();
    const kat = kategoriler.find(x=>x.id===p.categoryId);
    if(kat){
      kat.items.push({ id:d.id, ...p, price:Number(p.price) });
    }
  });

  render();
}

// RENDER
function render(){
  let html = "";

  kategoriler.forEach(k=>{
    html += `<div class="products">`;

    k.items.forEach(p=>{
      html += `
      <div class="card">
        <img src="${p.image || 'https://via.placeholder.com/300'}">
        <div class="cardContent">
          <h3>${p.name}</h3>
          <div class="bottom">
            <span class="price">${p.price}₺</span>
            <button class="addBtn" onclick="ekle('${p.id}','${p.name}',${p.price})">+</button>
          </div>
        </div>
      </div>`;
    });

    html += `</div>`;
  });

  document.getElementById("menu").innerHTML = html;
}

// SEPET EKLE
window.ekle = (id,name,price)=>{
  const item = sepet.find(x=>x.id===id);
  if(item) item.qty++;
  else sepet.push({id,name,price,qty:1});
  alert(name + " eklendi");
};

// SİPARİŞ
window.siparis = async ()=>{
  if(sepet.length===0) return alert("Sepet boş");

  let total=0;
  sepet.forEach(i=> total += i.price*i.qty);

  await addDoc(collection(db,"orders"),{
    table: masa,
    items: sepet,
    total,
    closed:false,
    createdAt: serverTimestamp()
  });

  alert("Sipariş gönderildi");
  sepet=[];
};

// 🔥 MASA HESABI CANLI
function hesapDinle(){

  onSnapshot(collection(db,"orders"), (snap)=>{

    let map = {};
    let total = 0;

    snap.forEach(d=>{
      const o = d.data();
      if(!o || o.table !== masa || o.closed) return;

      (o.items || []).forEach(i=>{
        if(!map[i.name]) map[i.name] = { qty:0, total:0 };

        map[i.name].qty += i.qty;
        map[i.name].total += i.price * i.qty;

        total += i.price * i.qty;
      });
    });

    let html = "";

    Object.keys(map).forEach(name=>{
      html += `
      <div style="display:flex;justify-content:space-between;">
        <span>${name} x${map[name].qty}</span>
        <div>
          <button onclick="azalt('${name}')">➖</button>
          <button onclick="arttir('${name}')">➕</button>
        </div>
      </div>`;
    });

    document.getElementById("cartItems").innerHTML = html || "Henüz sipariş yok";
    document.getElementById("cartTotal").innerText = "Toplam: " + total + "₺";
    document.getElementById("total").innerText = "Toplam: " + total + "₺";
  });
}

// ➕ ➖ GÜNCELLE
window.arttir = async (urun)=>{
  const snap = await getDocs(collection(db,"orders"));
  snap.forEach(async d=>{
    const o = d.data();
    if(o.table !== masa || o.closed) return;

    let items = o.items.map(i=>{
      if(i.name===urun) i.qty++;
      return i;
    });

    await updateDoc(doc(db,"orders",d.id),{items});
  });
};

window.azalt = async (urun)=>{
  const snap = await getDocs(collection(db,"orders"));
  snap.forEach(async d=>{
    const o = d.data();
    if(o.table !== masa || o.closed) return;

    let items = o.items.map(i=>{
      if(i.name===urun) i.qty--;
      return i;
    }).filter(i=>i.qty>0);

    await updateDoc(doc(db,"orders",d.id),{items});
  });
};

// GARSON
window.garson = async ()=>{
  await addDoc(collection(db,"calls"),{
    table: masa,
    createdAt: serverTimestamp()
  });
  alert("Garson geliyor");
};

// HESAP
window.hesap = async ()=>{
  await addDoc(collection(db,"billRequests"),{
    table: masa,
    createdAt: serverTimestamp()
  });
  alert("Hesap istendi");
};

// PANEL
window.acSepet = ()=> document.getElementById("cartPanel").classList.add("active");
window.kapatSepet = ()=> document.getElementById("cartPanel").classList.remove("active");

loadMenu();
hesapDinle();

</script>

</body>
</html>
