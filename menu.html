<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Menü</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

.top{
  background:#111;
  color:white;
  padding:15px;
  text-align:center;
}

.actions{
  display:flex;
  gap:10px;
  padding:10px;
}

.actions button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
}

.call{ background:#ff9800; }
.bill{ background:#444; }

.products{ padding:10px; }

.card{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card button{
  margin-top:10px;
  background:#28a745;
  color:white;
  border:none;
  padding:10px;
  width:100%;
  border-radius:6px;
}

.hesap{
  background:#fff;
  padding:10px;
  margin:10px;
  border-radius:10px;
}

.cart{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:2px solid #ccc;
  padding:10px;
}

.send{
  background:#007bff;
  color:white;
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="top">
  <h3 id="masa"></h3>
</div>

<div class="actions">
  <button class="call" onclick="garson()">🛎 Garson</button>
  <button class="bill" onclick="hesap()">💳 Hesap İste</button>
</div>

<!-- ✅ HESAP ALANI -->
<div class="hesap">
  <h3>🧾 Hesabım</h3>
  <div id="hesapList">Henüz sipariş yok</div>
  <h3 id="hesapTotal">Toplam: 0₺</h3>
</div>

<div class="products" id="menu"></div>

<div class="cart">
  <div id="cartList"></div>
  <h3 id="total">Toplam: 0₺</h3>
  <button class="send" onclick="siparis()">Siparişi Gönder</button>
</div>

<script type="module">

// 🔥 FIREBASE
import { db } from "./app.js";

import {
  collection,
  getDocs,
  addDoc,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔐 MASA
const masa = new URLSearchParams(location.search).get("table");

if(!masa){
  document.body.innerHTML = "<h2 style='text-align:center;margin-top:50px'>QR ile giriş yapın</h2>";
  throw new Error("Masa yok");
}

document.getElementById("masa").innerText = "Masa: " + masa;

// 🛒 SEPET
let sepet = [];

// 🔥 MENÜ YÜKLE
async function loadMenu(){
  // 🔥 TÜM VERİLERİ ÇEK
const urunSnap = await getDocs(collection(db,"products"));
const katSnap = await getDocs(collection(db,"categories"));

// 🔥 KATEGORİLERİ HAZIRLA
let kategoriler = {};

katSnap.forEach(d=>{
  kategoriler[d.id] = {
    name: d.data().name,
    items: []
  };
});

// 🔥 ÜRÜNLERİ KATEGORİYE DAĞIT
urunSnap.forEach(d=>{
  const p = d.data();

  if(p.categoryId && kategoriler[p.categoryId]){
    kategoriler[p.categoryId].items.push({
      id: d.id,   // 🔥 EN ÖNEMLİ SATIR
      ...p
      price: Number(p.price)
    });
  }
});

// 🔥 HTML OLUŞTUR
let html = "";

Object.values(kategoriler).forEach(k=>{

  if(k.items.length === 0) return;

  html += `<h2>${k.name}</h2>`;

  k.items.forEach(p=>{
    html += `
    <div class="card">
      <b>${p.name}</b><br>
      ${p.price}₺<br><br>

      <button onclick="ekle('${p.id}','${p.name}',${p.price})">
        ➕ Sepete Ekle
      </button>
    </div>
    `;
  });

});

document.getElementById("menu").innerHTML = html;
}

// ➕ SEPET
window.ekle = (id,name,price)=>{

  const item = sepet.find(x=>x.id===id);

  if(item){
    item.qty++;
  }else{
    sepet.push({id,name,price,qty:1});
  }

  guncelle();
};

// 🔄 SEPET GÜNCELLE
function guncelle(){

  let html="";
  let total=0;

  sepet.forEach(i=>{
    html += `${i.name} x ${i.qty}<br>`;
    total += i.price * i.qty;
  });

  document.getElementById("cartList").innerHTML = html;
  document.getElementById("total").innerText = "Toplam: " + total + "₺";
}

// 📦 SİPARİŞ GÖNDER
window.siparis = async ()=>{

  if(sepet.length===0){
    alert("Sepet boş");
    return;
  }

  let total=0;
  sepet.forEach(i=> total += i.price*i.qty);

  await addDoc(collection(db,"orders"),{
    table: masa,
    items: sepet,
    total: total,
    status: "Bekliyor",
    closed: false,
    createdAt: serverTimestamp()
  });

  alert("Sipariş gönderildi");

  sepet=[];
  guncelle();
};

// 🛎 GARSON
window.garson = async ()=>{
  await addDoc(collection(db,"calls"),{
    table: masa,
    createdAt: serverTimestamp()
  });

  alert("Garson geliyor");
};

// 💳 HESAP İSTE
window.hesap = async ()=>{

  // 🔥 MASANIN TÜM SİPARİŞLERİNİ TOPLA
  const snap = await getDocs(collection(db,"orders"));

  let total = 0;
  let items = [];

  snap.forEach(d=>{
    const o = d.data();

    if(o.table === masa && !o.closed){

      total += o.total || 0;

      (o.items || []).forEach(i=>{
        items.push(i.name + " x" + i.qty);
      });

    }
  });

  await addDoc(collection(db,"billRequests"),{
    table: masa,
    total: total,
    items: items,
    createdAt: serverTimestamp()
  });

  alert("Hesap istendi");
};

// 🔥 HESAP CANLI TAKİP
function hesapYukle(){

  onSnapshot(collection(db,"orders"), (snap)=>{

    let html = "";
    let total = 0;

    snap.forEach(d=>{

      const o = d.data();

      // sadece bu masa
      if(o.table !== masa) return;

      // sadece açık hesap
      if(o.closed === true) return;

      (o.items || []).forEach(i=>{
        html += `${i.name} x${i.qty}<br>`;
        total += i.price * i.qty;
      });

    });

    document.getElementById("hesapList").innerHTML =
      html || "Henüz sipariş yok";

    document.getElementById("hesapTotal").innerText =
      "Toplam: " + total + "₺";

  });
}

// 🚀 BAŞLAT
loadMenu();
hesapYukle();

</script>

</body>
</html>
