<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rüzgar Gülü Panel</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  padding:20px;
}

h1{text-align:center;}

.section{margin-top:25px;}

.card{
  background:#222;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

button{
  padding:8px 12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn-hazir{background:orange;}
.btn-teslim{background:green;color:white;}
.btn-sil{background:red;color:white;}
</style>

</head>
<body>

<h1>🍽 Rüzgar Gülü Panel</h1>

<div class="section">
<h2>🆕 Yeni Siparişler</h2>
<div id="yeni"></div>
</div>

<div class="section">
<h2>🍳 Hazırlananlar</h2>
<div id="hazir"></div>
</div>

<div class="section">
<h2>🛎 Garson Çağrıları</h2>
<div id="calls"></div>
</div>

<div class="section">
<h2>💰 Hesap İstekleri</h2>
<div id="bills"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔥 FIREBASE
const app = initializeApp({
  apiKey: "AIzaSyCj4F_8WOwLzVoREs-gRZDXfgYEkLtNvig",
  authDomain: "ruzgarguluqr.firebaseapp.com",
  projectId: "ruzgarguluqr"
});

const db = getFirestore(app);

// =====================
// SİPARİŞLER
// =====================

onSnapshot(collection(db,"orders"), snap=>{

let yeniHTML="";
let hazirHTML="";

snap.forEach(d=>{

  const o = d.data();

  // güvenlik
  if(!o) return;
  if(o.closed === true) return;

  // items güvenli
  const items = (o.items || [])
    .map(i => (i?.name || "Ürün") + " x" + (i?.qty || 1))
    .join("<br>");

  // YENİ SİPARİŞ
  if(o.status === "yeni" || o.status === "Bekliyor"){

    yeniHTML += `
    <div class="card">
      <b>${o.table || "-"}</b><br><br>
      ${items || "Ürün yok"}<br><br>
      <b>${o.total || 0}₺</b><br>

      <button class="btn-hazir"
      onclick="hazir('${d.id}')">Hazırla</button>
    </div>
    `;
  }

  // HAZIR SİPARİŞ
  if(o.status === "hazır"){

    hazirHTML += `
    <div class="card">
      <b>${o.table || "-"}</b><br><br>
      ${items}<br><br>
      <b>${o.total}₺</b><br>

      <button class="btn-teslim"
      onclick="teslim('${d.id}')">Teslim Et</button>
    </div>
    `;
  }

});

document.getElementById("yeni").innerHTML =
  yeniHTML || "Sipariş yok";

document.getElementById("hazir").innerHTML =
  hazirHTML || "Yok";

});

// =====================
// GARSON
// =====================

onSnapshot(collection(db,"calls"), snap=>{

let html="";

snap.forEach(d=>{
  const c = d.data();

  html+=`
  <div class="card">
    Masa: ${c?.table || "-"}
    <button class="btn-sil"
    onclick="silCall('${d.id}')">Temizle</button>
  </div>
  `;
});

document.getElementById("calls").innerHTML =
  html || "Yok";

});

// =====================
// HESAP
// =====================

onSnapshot(collection(db,"billRequests"), snap=>{

let html="";

snap.forEach(d=>{
  const b = d.data();

  html+=`
  <div class="card">
    Masa: ${b?.table || "-"}
    <button class="btn-sil"
    onclick="silBill('${d.id}')">Temizle</button>
  </div>
  `;
});

document.getElementById("bills").innerHTML =
  html || "Yok";

});

// =====================
// AKSİYONLAR
// =====================

window.hazir = async(id)=>{
  await updateDoc(doc(db,"orders",id),{
    status:"hazır"
  });
};

window.teslim = async(id)=>{
  await updateDoc(doc(db,"orders",id),{
    status:"Teslim Edildi",
    closed:true
  });
};

window.silCall = async(id)=>{
  await deleteDoc(doc(db,"calls",id));
};

window.silBill = async(id)=>{
  await deleteDoc(doc(db,"billRequests",id));
};

</script>

</body>
</html>
