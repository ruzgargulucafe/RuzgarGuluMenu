// ================= MASA =================
async function masa(){
document.getElementById("app").innerHTML=`
<input id="m" placeholder="Masa adı">
<button onclick="ekleMasa()">Ekle</button>
<div id="list"></div>
`;

const snap = await getDocs(collection(db,"tables"));

snap.forEach(d=>{

h+=`
<div class="card">
<b>${t.name}</b><br>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${qr}">

<button onclick="silMasa('${d.id}')">Sil</button>

});

document.getElementById("list").innerHTML=h;

window.ekleMasa = async()=>{
const val = document.getElementById("m").value.trim();
if(val==="") return alert("Masa adı gir");

await addDoc(collection(db,"tables"),{name:val});

window.silMasa = async(id)=>{

 // ================= KATEGORİ =================
async function kategori(){

  document.getElementById("app").innerHTML = `
    <input id="k" placeholder="Kategori adı">
    <button onclick="ekleKat()">Ekle</button>
    <div id="list"></div>
  `;

  const snap = await getDocs(collection(db,"categories"));

  const liste = snap.docs.map(d => ({
    id: d.id,
    ...d.data(),
    order: Number(d.data().order ?? 9999)
  }));

  liste.sort((a,b) => a.order - b.order);

  let h = "";

  liste.forEach((k,index) => {
    h += `
      <div class="card">
        <b>${k.name}</b>
        <div style="margin-top:10px">
          <button onclick="kategoriTasi('${k.id}',-1)"
            ${index === 0 ? "disabled" : ""}>⬆️ Yukarı</button>

          <button onclick="kategoriTasi('${k.id}',1)"
            ${index === liste.length-1 ? "disabled" : ""}>⬇️ Aşağı</button>

          <button onclick="silKat('${k.id}')">Sil</button>
        </div>
      </div>
    `;
  });

  document.getElementById("list").innerHTML =
    h || "Henüz kategori yok";
}

// KATEGORİ SIRASINI KAYDET
window.kategoriTasi = async (id, yon) => {
  try {
    const snap = await getDocs(collection(db,"categories"));

    const liste = snap.docs.map(d => ({
      id: d.id,
      order: Number(d.data().order ?? 9999)
    }));

    liste.sort((a,b) => a.order - b.order);

    const index = liste.findIndex(k => k.id === id);
    const hedef = index + yon;

    if(index < 0 || hedef < 0 || hedef >= liste.length) return;

    [liste[index], liste[hedef]] = [liste[hedef], liste[index]];

    const batch = writeBatch(db);

    liste.forEach((k,i) => {
      batch.update(doc(db,"categories",k.id), {order: i + 1});
    });

    await batch.commit();
    await kategori();

  } catch(e) {
    console.error(e);
    alert("Kategori sıralaması kaydedilemedi: " + e.message);
  }
};

// KATEGORİ EKLE
window.ekleKat = async () => {
  const input = document.getElementById("k");
  const val = input.value.trim();

  if(val === ""){
    alert("Kategori boş olamaz");
    return;
  }

  try {
    const snap = await getDocs(collection(db,"categories"));
    const maxOrder = snap.docs.reduce(
      (max,d) => Math.max(max, Number(d.data().order ?? 0)), 0
    );

    await addDoc(collection(db,"categories"), {
      name: val,
      order: maxOrder + 1
    });

    kategori();
  } catch(e) {
    console.error(e);
    alert("Kategori eklenemedi: " + e.message);
  }
};

// KATEGORİ SİL
window.silKat = async(id) => {
  await deleteDoc(doc(db,"categories",id));
  kategori();
};

<input id="u" placeholder="Ad">
<input id="f" placeholder="Fiyat">

snap.forEach(d=>{

h+=`
<div class="card">

<div id="view_${d.id}">

// ================= EKLE =================
window.ekleUrun = async()=>{

const name = document.getElementById("u").value.trim();
const price = Number(document.getElementById("f").value);
const file = document.getElementById("resimFile").files[0];
const kdv = Number(document.getElementById("kdv").value);
const kategoriId = document.getElementById("kategoriSec").value;

if(!kategoriId){
  alert("Kategori seç");
  return;
}

if(name === "" || !price){
  alert("Eksik bilgi");
  return;
}

let imageURL = "";

// 🔥 CLOUDINARY YÜKLE
if(file){

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", "urunler");

  const res = await fetch("https://api.cloudinary.com/v1_1/uahcjlsb/image/upload", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  if(!data.secure_url){
    alert("Foto yüklenemedi ❌");
    console.log(data);
    return;
  }

  imageURL = data.secure_url;
}

// 🔥 FIRESTORE
await addDoc(collection(db,"products"),{
  name,
  price,
  kdv,
  categoryId: kategoriId,
  description: document.getElementById("aciklama").value,
  image: imageURL
});

alert("Ürün eklendi ✅");
urun();
};

 // ================= ÜRÜN SIRALAMA =================
window.urunTasi = async (id, yon, categoryId) => {
  try {
    const snap = await getDocs(collection(db,"products"));

    const liste = snap.docs
      .filter(d => d.data().categoryId === categoryId)
      .map(d => ({
        id: d.id,
        order: Number(d.data().order ?? 9999)
      }));

    liste.sort((a,b) => a.order - b.order);

    const index = liste.findIndex(p => p.id === id);
    const hedef = index + yon;

    if(index < 0 || hedef < 0 || hedef >= liste.length) return;

    [liste[index], liste[hedef]] = [liste[hedef], liste[index]];

    const batch = writeBatch(db);

    liste.forEach((p,i) => {
      batch.update(doc(db,"products",p.id), {
        order: i + 1
      });
    });

    await batch.commit();
    await urun();

  } catch(e) {
    console.error(e);
    alert("Ürün sıralaması kaydedilemedi: " + e.message);
  }
};

// ================= SİL =================
window.silUrun=async(id)=>{
await deleteDoc(doc(db,"products",id));
urun();
};

if(!onay) return;

const snap = await getDocs(collection(db,"products"));
const promises = [];

snap.forEach(d=>{
  promises.push(deleteDoc(doc(db,"products",d.id)));

await Promise.all(promises);

alert("Tüm ürünler silindi ❌");

// ================= SİPARİŞ =================
function siparis(){

onSnapshot(collection(db,"orders"), snap=>{

let html = "";

const today = new Date();

snap.forEach(d=>{

  const o = d.data();

  if(!o || !o.createdAt) return;

  let tarih;

  try{
    tarih = o.createdAt.toDate();
  }catch{
    return;
  }

  // 🔥 SADECE BUGÜN
  if(
    tarih.getDate() !== today.getDate() ||
    tarih.getMonth() !== today.getMonth() ||
    tarih.getFullYear() !== today.getFullYear()
  ){
    return;
  }

  // 🕒 SAAT + TARİH FORMAT
  const saat = tarih.toLocaleTimeString("tr-TR", {
    hour: "2-digit",
    minute: "2-digit"
  });

  const tarihStr = tarih.toLocaleDateString("tr-TR");

  // 📦 ÜRÜNLER
  let urunler = "";
  (o.items || []).forEach(i=>{
    urunler += `${i.name} x${i.qty}<br>`;
  });

  html += `
  <div class="card">
    <b>🪑 Masa: ${o.table}</b><br>
    <small>📅 ${tarihStr} - 🕒 ${saat}</small><br><br>
    ${urunler}
    <b>${o.total}₺</b>
  </div>`;
});

document.getElementById("app").innerHTML = html || "Bugün sipariş yok";

});

}

// ================= CİRO (FİLTRELİ PRO) =================

let unsubCiro = null;

function ciro(){

if(unsubCiro) unsubCiro();

document.getElementById("app").innerHTML = `

<div class="card">
<h3>📅 Filtre</h3>

Başlangıç Tarih:
<input type="date" id="t1"><br><br>

Bitiş Tarih:
<input type="date" id="t2"><br><br>

Başlangıç Saat:
<input type="time" id="s1"><br><br>

Bitiş Saat:
<input type="time" id="s2"><br><br>

<button onclick="filtreleCiro()">Filtrele</button>
</div>

<div id="ciroSonuc"></div>

`;

window.filtreleCiro = ()=>{

if(unsubCiro) unsubCiro();

unsubCiro = onSnapshot(collection(db,"orders"), snap=>{

let toplam = 0;
let nakit = 0;
let kart = 0;

let saatlik = {};

const t1 = document.getElementById("t1").value;
const t2 = document.getElementById("t2").value;
const s1 = document.getElementById("s1").value || "00:00";
const s2 = document.getElementById("s2").value || "23:59";

if(!t1 || !t2){
  alert("Tarih seç");
  return;
}

// tarihleri oluştur
const baslangic = new Date(t1 + "T" + s1);
const bitis = new Date(t2 + "T" + s2);

snap.forEach(d=>{

  const o = d.data();

  if(!o || !o.closed || !o.paidAt) return;

  let tarih;

  try{
    tarih = o.paidAt.toDate();
  }catch{
    return;
  }

  // 🎯 FİLTRE
  if(tarih < baslangic || tarih > bitis) return;

  toplam += o.total || 0;

  if(o.paymentType === "Nakit") nakit += o.total || 0;
  if(o.paymentType === "Kart") kart += o.total || 0;

  const saat = tarih.getHours();

  if(!saatlik[saat]) saatlik[saat] = 0;
  saatlik[saat] += o.total || 0;

});

// ================= SAATLİK =================
let saatHTML = "";

for(let i=0;i<24;i++){
  saatHTML += `
  <div class="card">
    ${i.toString().padStart(2,"0")}:00 → ${saatlik[i] || 0}₺
  </div>`;
}

// ================= SONUÇ =================
document.getElementById("ciroSonuc").innerHTML = `

<div class="card">
<h3>💰 Sonuç</h3>

Toplam: <b>${toplam}₺</b><br><br>

💵 Nakit: ${nakit}₺<br>
💳 Kart: ${kart}₺
</div>

<h3>⏰ Saatlik Dağılım</h3>
${saatHTML}

`;

});

};

}
  
 // ================= PDF MENÜ OLUŞTUR =================

window.pdfMenu = async () => {

  // Pencereyi kullanıcı tıklarken aç
  const pencere = window.open("about:blank", "_blank");

  if (!pencere) {
    alert("PDF penceresi açılamadı. Tarayıcıda açılır pencerelere izin ver.");
    return;
  }

  pencere.document.write(`
    <html>
      <head><title>RüzgarGülü Cafe Menü</title></head>
      <body style="font-family:Arial;padding:30px">
        Menü hazırlanıyor...
      </body>
    </html>
  `);

  try {

    // Firebase'den güncel verileri al
    const [katSnap, urunSnap] = await Promise.all([
      getDocs(collection(db, "categories")),
      getDocs(collection(db, "products"))
    ]);

    const kategoriler = katSnap.docs.map(d => ({
      id: d.id,
      name: d.data().name || "",
      order: Number(d.data().order ?? 9999)
    }));

    const urunler = urunSnap.docs.map(d => ({
      id: d.id,
      ...d.data(),
      name: d.data().name || "",
      price: Number(d.data().price || 0),
      order: Number(d.data().order ?? 9999)
    }));

    kategoriler.sort((a, b) => a.order - b.order);

    // HTML içine yazılacak metinleri güvenli hâle getir
    const guvenli = (metin) => String(metin ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    let menuHTML = "";

    kategoriler.forEach(k => {

      const liste = urunler
        .filter(p => p.categoryId === k.id)
        .sort((a, b) => a.order - b.order);

      if (liste.length === 0) return;

      menuHTML += `
        <section class="kategori">
          <h2>${guvenli(k.name)}</h2>
          <div class="urunler">
            ${liste.map(p => `
              <div class="urun">
                <div class="urunAdi">
                  ${guvenli(p.name)}
                  ${p.description ? `
                    <small>${guvenli(p.description)}</small>
                  ` : ""}
                </div>
                <div class="nokta"></div>
                <div class="fiyat">
                  ${p.price.toLocaleString("tr-TR")} ₺
                </div>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    });

    if (!menuHTML) {
      pencere.close();
      alert("PDF oluşturmak için kategoriler ve ürünler bulunamadı.");
      return;
    }

    const tarih = new Date().toLocaleDateString("tr-TR");

    const html = `
      <!DOCTYPE html>
      <html lang="tr">
      <head>
        <meta charset="UTF-8">
        <title>RüzgarGülü Cafe Menü</title>

        <style>
          @page {
            size: A4;
            margin: 15mm;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
