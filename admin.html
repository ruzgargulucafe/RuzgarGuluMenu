<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{margin:0;font-family:Arial;display:flex;background:#f4f6f9}
.sidebar{width:220px;background:#111;color:#fff;height:100vh;padding:15px}
.sidebar button{width:100%;margin:5px 0;padding:10px;background:#333;border:none;color:#fff}
.content{flex:1;padding:20px}
.card{background:#fff;padding:15px;margin-bottom:10px;border-radius:10px}
#menuBtn{
  position:fixed;
  top:10px;
  left:10px;
  z-index:999;
  background:#111;
  color:#fff;
  border:none;
  padding:10px 12px;
  font-size:18px;
  border-radius:6px;
}

@media(max-width:768px){
  .sidebar{
    position:fixed;
    left:-240px;
    top:0;
    transition:0.3s;
    z-index:998;
  }

  .sidebar.active{
    left:0;
  }
}
</style>
  
</head>

<body>
  
<button id="menuBtn">☰</button>
  
<div class="sidebar">
<h3>Admin</h3>
<button onclick="page('masa')">Masalar</button>
<button onclick="page('kategori')">Kategoriler</button>
<button onclick="page('urun')">Ürünler</button>
<button onclick="page('siparis')">Siparişler</button>
<button onclick="page('garson')">Garson</button>
<button onclick="page('ciro')">Ciro</button>
<button onclick="logout()">Çıkış</button>
</div>

<div class="content">
<h2 id="title"></h2>
<div id="app"></div>
</div>

<script type="module">

// 🔐 ŞİFRE KONTROL
const sifre = "Ruzgar2026";

if(localStorage.getItem("adminLogin") !== "ok"){
  const giris = prompt("Admin şifresi:");

  if(giris === sifre){
    localStorage.setItem("adminLogin","ok");
  }else{
    alert("Yanlış şifre");
    location.href = "index.html";
  }
}

// 🚪 ÇIKIŞ
window.logout = ()=>{
  localStorage.removeItem("adminLogin");
  location.href = "index.html";
};

// 🔥 FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  onSnapshot,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

// 🔑 CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCj4F_8WOwLzVoREs-gRZDXfgYEkLtNvig",
  authDomain: "ruzgarguluqr.firebaseapp.com",
  projectId: "ruzgarguluqr",
  storageBucket: "ruzgarguluqr.appspot.com" // ⚠️ BUNU EKLEDİK
};

// 🚀 INIT
const appF = initializeApp(firebaseConfig);
const db = getFirestore(appF);
const storage = getStorage(appF);
// SAYFA
window.page = (p)=>{
document.getElementById("title").innerText = p.toUpperCase();

if(p==="masa") masa();
if(p==="kategori") kategori();
if(p==="urun") urun();
if(p==="siparis") siparis();
if(p==="garson") garson();
if(p==="ciro") ciro();
};

// ================= MASA =================
async function masa(){
document.getElementById("app").innerHTML=`
<input id="m" placeholder="Masa adı">
<button onclick="ekleMasa()">Ekle</button>
<div id="list"></div>
`;

const snap = await getDocs(collection(db,"tables"));
let h="";

snap.forEach(d=>{
const t=d.data();
const qr=`https://ruzgargulucafe.github.io/RuzgarGuluMenu/menu.html?table=${t.name}`;

h+=`
<div class="card">
<b>${t.name}</b><br>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${qr}">
<br>
<a target="_blank" href="${qr}">Menüyü Aç</a>
<button onclick="silMasa('${d.id}')">Sil</button>
</div>`;
});

document.getElementById("list").innerHTML=h;
}

window.ekleMasa = async()=>{
const val = document.getElementById("m").value.trim();
if(val==="") return alert("Masa adı gir");

await addDoc(collection(db,"tables"),{name:val});
document.getElementById("m").value="";
masa();
};

window.silMasa = async(id)=>{
await deleteDoc(doc(db,"tables",id));
masa();
};

// ================= KATEGORİ =================
async function kategori(){

document.getElementById("app").innerHTML=`
<input id="k" placeholder="Kategori adı">
<button onclick="ekleKat()">Ekle</button>
<div id="list"></div>
`;

const snap = await getDocs(collection(db,"categories"));

let h="";

snap.forEach(d=>{
const data = d.data();

h+=`
<div class="card">
${data.name}
<button onclick="silKat('${d.id}')">Sil</button>
</div>`;
});

document.getElementById("list").innerHTML=h;
}

// EKLE
window.ekleKat = async ()=>{

const input = document.getElementById("k");
const val = input.value.trim();

if(val === ""){
  alert("Kategori boş olamaz");
  return;
}

try{

  await addDoc(collection(db,"categories"),{
    name: val
  });

  input.value = ""; // 🔥 input temizle
  kategori();       // 🔥 listeyi yenile

}catch(e){
  console.error(e);
  alert("Hata oluştu");
}

};

// SİL
window.silKat = async(id)=>{
await deleteDoc(doc(db,"categories",id));
kategori();
};

// ================= ÜRÜN =================
async function urun(){
document.getElementById("app").innerHTML=`
<input id="u" placeholder="Ad">
<input id="f" placeholder="Fiyat">
<input id="aciklama" placeholder="Açıklama">
<input type="file" id="resimFile" accept="image/*">
<select id="kdv">
  <option value="0">KDV Yok</option>
  <option value="10">%10 KDV</option>
  <option value="20">%20 KDV</option>
</select>
<button onclick="ekleUrun()">Ekle</button>
<div id="list"></div>
`;

const snap=await getDocs(collection(db,"products"));
let h="";

snap.forEach(d=>{
const p=d.data();
h+=`
<div class="card">

<div id="view_${d.id}">
  <b>${p.name}</b><br>
  ${p.price}₺<br>
  <button onclick="duzenleUrunAc('${d.id}','${p.name}',${p.price})">Düzenle</button>
  <button onclick="silUrun('${d.id}')">Sil</button>
</div>

<div id="edit_${d.id}" style="display:none">
  <input id="ad_${d.id}" value="${p.name}">
  <input id="fiyat_${d.id}" value="${p.price}">
  <button onclick="guncelleUrun('${d.id}')">Kaydet</button>
  <button onclick="iptalUrun('${d.id}')">İptal</button>
</div>

</div>`;
});

document.getElementById("list").innerHTML=h;
}

window.ekleUrun = async()=>{

const name = document.getElementById("u").value.trim();
const price = Number(document.getElementById("f").value);
const file = document.getElementById("resimFile").files[0];
const kdv = Number(document.getElementById("kdv").value);

if(name === "" || !price) return alert("Eksik bilgi");

let imageURL = "";

// 📸 FOTO YÜKLE
if(file){
  const storage = getStorage(); // 🔥 eksikti
  const fileRef = ref(storage, "urunler/" + Date.now() + "_" + file.name);

  await uploadBytes(fileRef, file);
  imageURL = await getDownloadURL(fileRef);
}

// 🔥 FIRESTORE'A KAYDET
await addDoc(collection(db,"products"),{
  name: name,
  price: price,
  kdv: kdv,
  description: document.getElementById("aciklama").value,
  image: imageURL
});

urun();
};

window.silUrun=async(id)=>{
await deleteDoc(doc(db,"products",id));
urun();
};
  // ✏️ DÜZENLE AÇ
window.duzenleUrunAc = (id,name,price)=>{
  document.getElementById("view_"+id).style.display="none";
  document.getElementById("edit_"+id).style.display="block";
};

// ❌ İPTAL
window.iptalUrun = (id)=>{
  document.getElementById("view_"+id).style.display="block";
  document.getElementById("edit_"+id).style.display="none";
};

// 💾 GÜNCELLE
window.guncelleUrun = async(id)=>{

  const yeniAd = document.getElementById("ad_"+id).value.trim();
  const yeniFiyat = Number(document.getElementById("fiyat_"+id).value);

  if(yeniAd==="" || !yeniFiyat){
    alert("Eksik bilgi");
    return;
  }

  await updateDoc(doc(db,"products",id),{
    name: yeniAd,
    price: yeniFiyat
  });

  urun(); // listeyi yenile
};

// ================= SİPARİŞ =================
function siparis(){

onSnapshot(collection(db,"orders"), snap=>{

let html = "";

const today = new Date();

snap.forEach(d=>{

  const o = d.data();

  if(!o || !o.createdAt) return;

  let tarih;

  try{
    tarih = o.createdAt.toDate();
  }catch{
    return;
  }

  // 🔥 SADECE BUGÜN
  if(
    tarih.getDate() !== today.getDate() ||
    tarih.getMonth() !== today.getMonth() ||
    tarih.getFullYear() !== today.getFullYear()
  ){
    return;
  }

  // 🕒 SAAT + TARİH FORMAT
  const saat = tarih.toLocaleTimeString("tr-TR", {
    hour: "2-digit",
    minute: "2-digit"
  });

  const tarihStr = tarih.toLocaleDateString("tr-TR");

  // 📦 ÜRÜNLER
  let urunler = "";
  (o.items || []).forEach(i=>{
    urunler += `${i.name} x${i.qty}<br>`;
  });

  html += `
  <div class="card">
    <b>🪑 Masa: ${o.table}</b><br>
    <small>📅 ${tarihStr} - 🕒 ${saat}</small><br><br>
    ${urunler}
    <b>${o.total}₺</b>
  </div>`;
});

document.getElementById("app").innerHTML = html || "Bugün sipariş yok";

});

}

// ================= GARSON =================
function garson(){

onSnapshot(collection(db,"calls"),snap=>{
let html="<h3>Garson</h3>";
snap.forEach(d=>{
html+=`
<div class="card">
Masa ${d.data().table}
<button onclick="silCall('${d.id}')">Temizle</button>
</div>`;
});
document.getElementById("app").innerHTML=html;
});

onSnapshot(collection(db,"billRequests"),snap=>{
let h="<h3>Hesap</h3>";
snap.forEach(d=>{
h+=`
<div class="card">
Masa ${d.data().table}
<button onclick="silBill('${d.id}')">Temizle</button>
</div>`;
});
document.getElementById("app").innerHTML += h;
});
}

window.silCall=async(id)=>{
await deleteDoc(doc(db,"calls",id));
};

window.silBill=async(id)=>{
await deleteDoc(doc(db,"billRequests",id));
};

// ================= CİRO (FİLTRELİ PRO) =================

let unsubCiro = null;

function ciro(){

if(unsubCiro) unsubCiro();

document.getElementById("app").innerHTML = `

<div class="card">
<h3>📅 Filtre</h3>

Başlangıç Tarih:
<input type="date" id="t1"><br><br>

Bitiş Tarih:
<input type="date" id="t2"><br><br>

Başlangıç Saat:
<input type="time" id="s1"><br><br>

Bitiş Saat:
<input type="time" id="s2"><br><br>

<button onclick="filtreleCiro()">Filtrele</button>
</div>

<div id="ciroSonuc"></div>

`;

window.filtreleCiro = ()=>{

if(unsubCiro) unsubCiro();

unsubCiro = onSnapshot(collection(db,"orders"), snap=>{

let toplam = 0;
let nakit = 0;
let kart = 0;

let saatlik = {};

const t1 = document.getElementById("t1").value;
const t2 = document.getElementById("t2").value;
const s1 = document.getElementById("s1").value || "00:00";
const s2 = document.getElementById("s2").value || "23:59";

if(!t1 || !t2){
  alert("Tarih seç");
  return;
}

// tarihleri oluştur
const baslangic = new Date(t1 + "T" + s1);
const bitis = new Date(t2 + "T" + s2);

snap.forEach(d=>{

  const o = d.data();

  if(!o || !o.closed || !o.paidAt) return;

  let tarih;

  try{
    tarih = o.paidAt.toDate();
  }catch{
    return;
  }

  // 🎯 FİLTRE
  if(tarih < baslangic || tarih > bitis) return;

  toplam += o.total || 0;

  if(o.paymentType === "Nakit") nakit += o.total || 0;
  if(o.paymentType === "Kart") kart += o.total || 0;

  const saat = tarih.getHours();

  if(!saatlik[saat]) saatlik[saat] = 0;
  saatlik[saat] += o.total || 0;

});

// ================= SAATLİK =================
let saatHTML = "";

for(let i=0;i<24;i++){
  saatHTML += `
  <div class="card">
    ${i.toString().padStart(2,"0")}:00 → ${saatlik[i] || 0}₺
  </div>`;
}

// ================= SONUÇ =================
document.getElementById("ciroSonuc").innerHTML = `

<div class="card">
<h3>💰 Sonuç</h3>

Toplam: <b>${toplam}₺</b><br><br>

💵 Nakit: ${nakit}₺<br>
💳 Kart: ${kart}₺
</div>

<h3>⏰ Saatlik Dağılım</h3>
${saatHTML}

`;

});

};

}
  
// START
page("masa");

  const menuBtn = document.getElementById("menuBtn");
const sidebar = document.querySelector(".sidebar");

menuBtn.onclick = ()=>{
  sidebar.classList.toggle("active");
};
  document.addEventListener("click", (e)=>{
  if(!sidebar.contains(e.target) && e.target !== menuBtn){
    sidebar.classList.remove("active");
  }
});
</script>

</body>
</html>
