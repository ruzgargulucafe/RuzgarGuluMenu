}<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{margin:0;font-family:Arial;display:flex;background:#f4f6f9}
.sidebar{width:220px;background:#111;color:#fff;height:100vh;padding:15px}
.sidebar button{width:100%;margin:5px 0;padding:10px;background:#333;border:none;color:#fff}
.content{flex:1;padding:20px}
.card{background:#fff;padding:15px;margin-bottom:10px;border-radius:10px}
</style>
</head>

<body>

<div class="sidebar">
<h3>Admin</h3>
<button onclick="page('masa')">Masalar</button>
<button onclick="page('kategori')">Kategoriler</button>
<button onclick="page('urun')">Ürünler</button>
<button onclick="page('siparis')">Siparişler</button>
<button onclick="page('garson')">Garson</button>
<button onclick="page('ciro')">Ciro</button>
<button onclick="logout()">Çıkış</button>
</div>

<div class="content">
<h2 id="title"></h2>
<div id="app"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCj4F_8WOwLzVoREs-gRZDXfgYEkLtNvig",
  authDomain: "ruzgarguluqr.firebaseapp.com",
  projectId: "ruzgarguluqr"
};

const appF = initializeApp(firebaseConfig);
const db = getFirestore(appF);
const auth = getAuth();

onAuthStateChanged(auth,u=>{
if(!u) location="index.html";
});

window.logout = ()=> signOut(auth);

// SAYFA
window.page = (p)=>{
document.getElementById("title").innerText = p.toUpperCase();

if(p==="masa") masa();
if(p==="kategori") kategori();
if(p==="urun") urun();
if(p==="siparis") siparis();
if(p==="garson") garson();
if(p==="ciro") ciro();
};

// ================= MASA =================
async function masa(){
document.getElementById("app").innerHTML=`
<input id="m" placeholder="Masa adı">
<button onclick="ekleMasa()">Ekle</button>
<div id="list"></div>
`;

const snap = await getDocs(collection(db,"tables"));
let h="";

snap.forEach(d=>{
const t=d.data();
const qr=`https://ruzgargulucafe.github.io/RuzgarGuluMenu/menu.html?table=${t.name}`;

h+=`
<div class="card">
<b>${t.name}</b><br>
<a target="_blank" href="${qr}">QR Aç</a><br>
<button onclick="silMasa('${d.id}')">Sil</button>
</div>`;
});

document.getElementById("list").innerHTML=h;
}

window.ekleMasa = async()=>{
const val = document.getElementById("m").value.trim();

if(val==="") return alert("Masa adı gir");

await addDoc(collection(db,"tables"),{name:val});

document.getElementById("m").value="";

masa();
};

window.silMasa = async(id)=>{
await deleteDoc(doc(db,"tables",id));
masa();
};

// ================= KATEGORİ =================
async function kategori(){
document.getElementById("app").innerHTML=`
<input id="k">
<button onclick="ekleKat()">Ekle</button>
<div id="list"></div>
`;

const snap=await getDocs(collection(db,"categories"));
let h="";
snap.forEach(d=>{
h+=`${d.data().name} <button onclick="silKat('${d.id}')">Sil</button><br>`;
});
document.getElementById("list").innerHTML=h;
}

window.ekleKat=async()=>{
const val = document.getElementById("k").value.trim();
if(val==="") return alert("Kategori boş olamaz");

await addDoc(collection(db,"categories"),{name:val});
kategori();
};

window.silKat=async(id)=>{
await deleteDoc(doc(db,"categories",id));
kategori();
};

// ================= ÜRÜN =================
async function urun(){
document.getElementById("app").innerHTML=`
<input id="u" placeholder="Ad">
<input id="f" placeholder="Fiyat">
<input id="aciklama" placeholder="Açıklama">
<input id="resim" placeholder="Resim URL">
<input id="kdv" placeholder="KDV %">
<select id="kdvTip">
<option value="dahil">KDV Dahil</option>
<option value="haric">KDV Hariç</option>
</select>
<button onclick="ekleUrun()">Ekle</button>
<div id="list"></div>
`;

const snap=await getDocs(collection(db,"products"));
let h="";

snap.forEach(d=>{
const p=d.data();
h+=`
<div class="card">
<img src="${p.image || ''}" width="80"><br>
<b>${p.name}</b><br>
${p.price}₺<br>
<button onclick="silUrun('${d.id}')">Sil</button>
</div>`;
});

document.getElementById("list").innerHTML=h;
}

window.ekleUrun=async()=>{
const name = document.getElementById("u").value.trim();
const price = Number(document.getElementById("f").value);

if(name==="" || !price) return alert("Eksik bilgi");

await addDoc(collection(db,"products"),{
name:name,
price:price,
description:document.getElementById("aciklama").value,
image:document.getElementById("resim").value,
kdv:Number(document.getElementById("kdv").value),
kdvType:document.getElementById("kdvTip").value
});
urun();
};

window.silUrun=async(id)=>{
await deleteDoc(doc(db,"products",id));
urun();
};

// ================= SİPARİŞ =================
function siparis(){

onSnapshot(collection(db,"orders"),snap=>{

let h="";

snap.forEach(d=>{
const o=d.data();

h+=`
<div class="card">
<b>${o.table}</b><br>
${o.items?.map(i=>i.name+" x"+i.qty).join("<br>")}
<br>${o.total}₺
</div>`;
});

document.getElementById("app").innerHTML=h;
});

}

// ================= GARSON =================
function garson(){

let html="";

onSnapshot(collection(db,"calls"),snap=>{
html="<h3>Garson</h3>";

snap.forEach(d=>{
html+=`
<div class="card">
Masa ${d.data().table}
<button onclick="silCall('${d.id}')">Temizle</button>
</div>`;
});

document.getElementById("app").innerHTML=html;
});

onSnapshot(collection(db,"billRequests"),snap=>{

let h="<h3>Hesap</h3>";

snap.forEach(d=>{
h+=`
<div class="card">
Masa ${d.data().table}
<button onclick="silBill('${d.id}')">Temizle</button>
</div>`;
});

let html = "";
html += h;

document.getElementById("app").innerHTML = html;
});
}

window.silCall=async(id)=>{
await deleteDoc(doc(db,"calls",id));
};

window.silBill=async(id)=>{
await deleteDoc(doc(db,"billRequests",id));
};

// ================= CİRO =================
async function ciro(){

let daily=0;
let monthly=0;

const snap=await getDocs(collection(db,"orders"));

const today=new Date().toDateString();
const month=new Date().getMonth();

snap.forEach(d=>{
const o=d.data();
if(!o.createdAt) return;

const t=new Date(o.createdAt.seconds*1000);

if(t.toDateString()==today) daily+=o.total;
if(t.getMonth()==month) monthly+=o.total;
});

document.getElementById("app").innerHTML=`
<h3>Günlük: ${daily}₺</h3>
<h3>Aylık: ${monthly}₺</h3>
`;
}

// START
page("masa");

</script>

</body>
</html>
