<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mutfak Paneli</title>

<style>
body{
  font-family:Arial;
  background:#222;
  color:#fff;
  padding:20px;
}

h1{
  text-align:center;
}

.card{
  background:#333;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

button{
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#28a745;
  color:white;
  width:100%;
  font-weight:bold;
}

.empty{
  text-align:center;
  margin-top:50px;
  opacity:0.6;
}
</style>
</head>

<body>

<h1>👨‍🍳 Mutfak Siparişleri</h1>

<div id="orders"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, updateDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔥 Firebase config (SENİN PROJE)
const firebaseConfig = {
  apiKey: "AIzaSyCj4F_8WOwLzVoREs-gRZDXfgYEkLtNvig",
  authDomain: "ruzgarguluqr.firebaseapp.com",
  projectId: "ruzgarguluqr"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔊 SES
const audio = new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");

// önceki sipariş sayısı
let lastCount = 0;

// 🔥 SİPARİŞLERİ CANLI DİNLE
onSnapshot(collection(db,"orders"), (snap)=>{

  let html = "";
  let count = 0;

  snap.forEach(d=>{

    const o = d.data();

    // SADECE BEKLEYENLER
    if(o.status === "Bekliyor"){

      count++;

      html += `
      <div class="card">
        <h2>🪑 Masa ${o.table}</h2>

        <div>
          ${(o.items || []).map(i=> i.name + " x" + i.qty).join("<br>")}
        </div>

        <br>
        <b>Toplam: ${o.total}₺</b>

        <button onclick="hazir('${d.id}')">
          ✅ Hazır Yap
        </button>
      </div>
      `;
    }

  });

  // 🔊 yeni sipariş sesi
  if(lastCount !== 0 && count > lastCount){
    audio.play().catch(()=>{});
  }

  lastCount = count;

  document.getElementById("orders").innerHTML =
    html || "<div class='empty'>Sipariş yok</div>";

});

// ✅ HAZIR BUTONU
window.hazir = async (id)=>{
  await updateDoc(doc(db,"orders",id),{
    status:"Hazır"
  });
};

</script>

</body>
</html>
